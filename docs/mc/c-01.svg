space="preserve" font-family="VT,monospace"># 3. Frontend</text><text x="24.00" y="366" font-size="23" fill="#d9a441" xml:space="preserve" font-family="VT,monospace">cd</text><text x="42.40" y="366" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace"> ../frontend</text><text x="24.00" y="392" font-size="23" fill="#d9a441" xml:space="preserve" font-family="VT,monospace">npm</text><text x="51.60" y="392" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace"> install</text><text x="24.00" y="444" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># 4. Environment</text><text x="24.00" y="470" font-size="23" fill="#d9a441" xml:space="preserve" font-family="VT,monospace">cp</text><text x="42.40" y="470" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace"> .env.example .env           </text><text x="309.20" y="470" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># edit if needed</text><g id="vines"><rect x="90" y="0" width="6" height="6" fill="#2f5229"/><rect x="132" y="0" width="6" height="6" fill="#2f5229"/><rect x="168" y="0" width="6" height="6" fill="#2f5229"/><rect x="192" y="0" width="6" height="6" fill="#4a7a3c"/><rect x="216" y="0" width="6" height="6" fill="#2f5229"/><rect x="240" y="0" width="6" height="6" fill="#2f5229"/><rect x="252" y="0" width="6" height="6" fill="#2f5229"/><rect x="258" y="0" width="6" height="6" fill="#2f5229"/><rect x="324" y="0" width="6" height="6" fill="#4a7a3c"/><rect x="366" y="0" width="6" height="6" fill="#2f5229"/><rect x="378" y="0" width="6" height="6" fill="#4a7a3c"/><rect x="486" y="0" width="6" height="6" fill="#4a7a3c"/><rect x="570" y="0" width="6" height="6" fill="#4a7a3c"/><rect x="582" y="0" width="6" height="6" fill="#2f5229"/><rect x="588" y="0" width="6" height="6" fill="#2f5229"/><rect x="618" y="0" width="6" height="6" fill="#2f5229"/><rect x="642" y="0" width="6" height="6" fill="#2f